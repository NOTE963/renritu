<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連立方程式 タイムアタック</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #0d1a26;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      max-width: 800px;
      width: 100%;
      background: #162b3b;
      border-radius: 28px;
      padding: 24px 20px 28px;
      box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.8);
      border: 1px solid #2f4a5e;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: #0f1e2b;
      padding: 4px 6px;
      border-radius: 40px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #8aadc2;
      cursor: pointer;
      transition: 0.15s;
      min-width: 60px;
    }

    .tab-btn.active {
      background: #2a4a60;
      color: #f0f9ff;
    }

    .tab-btn:hover:not(.active) {
      background: #1f384b;
      color: #c5dceb;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1e2b;
      border-radius: 40px;
      padding: 6px 14px;
      margin-bottom: 12px;
      color: #c8dce8;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timer {
      font-size: 1.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: #0b1723;
      padding: 0 14px;
      border-radius: 30px;
      color: #b3e4ff;
      letter-spacing: 1px;
    }

    .status-msg {
      background: #1a3343;
      padding: 4px 14px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .eq-panel {
      background: #0f1e2b;
      border-radius: 20px;
      padding: 14px 8px;
      margin: 4px 0 12px;
      border: 1px solid #2d4a5e;
    }

    .eq-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px 12px;
      flex-wrap: wrap;
      font-size: 1.4rem;
      color: #e6f2fa;
      font-weight: 500;
      padding: 2px 0;
    }

    .eq-row span {
      background: #162b3a;
      padding: 0 10px;
      border-radius: 20px;
      min-width: 36px;
      text-align: center;
      border: 1px solid #2f5066;
    }

    .input-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      margin: 10px 0 8px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1e2b;
      padding: 2px 10px 2px 14px;
      border-radius: 30px;
      border: 1px solid #2f4a5e;
    }

    .input-group label {
      color: #b2d3e8;
      font-weight: 600;
      font-size: 1rem;
    }

    .input-group input {
      background: #162b3a;
      border: none;
      padding: 6px 2px;
      width: 60px;
      border-radius: 20px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      outline: 1px solid transparent;
    }

    .input-group input:focus {
      outline: 1px solid #5a9ec9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 6px;
    }

    .btn {
      background: #1f465e;
      border: none;
      border-bottom: 3px solid #0f2a3b;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      color: #f2fcff;
      cursor: pointer;
      transition: 0.06s ease;
      box-shadow: 0 4px 0 #0b1e2b;
      flex: 1 0 auto;
      min-width: 80px;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b1e2b;
    }

    .btn-primary {
      background: #3a7da8;
      border-bottom-color: #1d4d6a;
    }

    .btn-success {
      background: #2a8266;
      border-bottom-color: #18523f;
    }

    .btn-danger {
      background: #b14f4f;
      border-bottom-color: #752f2f;
    }

    .btn-warning {
      background: #c97d2b;
      border-bottom-color: #8a5518;
    }

    .btn-purple {
      background: #7a4a8a;
      border-bottom-color: #4f2d5e;
    }

    .btn:disabled {
      opacity: 0.4;
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b1e2b;
      pointer-events: none;
    }

    .toast {
      background: #1a3343;
      padding: 6px 14px;
      border-radius: 24px;
      color: #c7e4f5;
      text-align: center;
      font-weight: 500;
      border-left: 4px solid #4f9bc9;
      margin: 8px 0 4px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .rank-section {
      background: #0f1e2b;
      border-radius: 20px;
      padding: 12px 10px 14px;
      border: 1px solid #2d4a5e;
      margin-top: 4px;
    }

    .rank-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c8e0ef;
      font-weight: 600;
      padding: 0 2px 8px 2px;
      border-bottom: 1px solid #234a5e;
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rank-tabs {
      display: flex;
      gap: 3px;
      background: #0f1e2b;
      padding: 3px;
      border-radius: 24px;
      border: 1px solid #234a5e;
    }

    .rank-tab-btn {
      padding: 3px 10px;
      border: none;
      background: transparent;
      border-radius: 20px;
      color: #8aadc2;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
      transition: 0.15s;
    }

    .rank-tab-btn.active {
      background: #2a4a60;
      color: #f0f9ff;
    }

    .rank-list {
      list-style: none;
      margin: 6px 0 0 0;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .rank-list li {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      margin: 2px 0;
      background: #1a3343;
      border-radius: 24px;
      color: #e6f2fa;
      border-left: 3px solid #3d7a9e;
      font-weight: 500;
      font-size: 0.85rem;
      align-items: center;
    }

    .rank-list .rank {
      color: #aacde2;
      font-weight: 700;
      margin-right: 8px;
    }

    .rank-list .time {
      background: #1d4054;
      padding: 0 10px;
      border-radius: 20px;
      font-weight: 600;
      color: #b3e4ff;
      font-size: 0.8rem;
    }

    .empty {
      text-align: center;
      color: #7b9eb3;
      padding: 16px 0;
      font-style: italic;
      justify-content: center !important;
    }

    .battle-section {
      background: #0f1e2b;
      border-radius: 20px;
      padding: 14px 12px 16px;
      border: 1px solid #2d4a5e;
      margin-top: 4px;
    }

    .battle-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      color: #c8e0ef;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .battle-players {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 8px 0 12px;
    }

    .player-box {
      background: #1a3343;
      padding: 8px 16px;
      border-radius: 20px;
      text-align: center;
      min-width: 80px;
      border: 2px solid #2d4a5e;
    }

    .player-box.you {
      border-color: #5a9ec9;
    }

    .player-box.opponent {
      border-color: #c97d2b;
    }

    .player-box .name {
      color: #e6f2fa;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .player-box .score {
      color: #b3e4ff;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .player-box .round-status {
      color: #8aacbf;
      font-size: 0.7rem;
    }

    .battle-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 4px;
    }

    .battle-room {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .battle-room input {
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      font-size: 0.85rem;
      width: 140px;
      outline: none;
    }

    .battle-room input:focus {
      border-color: #5a9ec9;
    }

    .battle-room .btn {
      flex: 0 1 auto;
      padding: 6px 16px;
      font-size: 0.8rem;
      min-width: 60px;
    }

    .battle-log {
      background: #0b1723;
      border-radius: 16px;
      padding: 8px 12px;
      margin-top: 8px;
      max-height: 60px;
      overflow-y: auto;
      color: #8aacbf;
      font-size: 0.8rem;
      border: 1px solid #1a3343;
    }

    .battle-log .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #1a3343;
    }
    .battle-log .log-entry:last-child {
      border-bottom: none;
    }

    .settings {
      background: #0f1e2b;
      border-radius: 20px;
      padding: 16px 14px;
      border: 1px solid #2d4a5e;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      color: #d6eaf5;
      font-weight: 500;
    }

    .setting-row label {
      min-width: 70px;
      font-size: 0.85rem;
    }

    .setting-row input,
    .setting-row select {
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      font-size: 0.85rem;
      outline: none;
      flex: 1;
      min-width: 100px;
    }

    .setting-row input:focus,
    .setting-row select:focus {
      border-color: #5a9ec9;
    }
    .setting-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .setting-row .btn {
      flex: 0 1 auto;
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    .footer {
      text-align: right;
      color: #5a7d93;
      font-size: 0.6rem;
      margin-top: 8px;
      opacity: 0.5;
    }

    .delete-section {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #2f4a5e;
      display: flex;
      justify-content: flex-end;
    }

    .name-locked {
      color: #8aacbf;
      font-size: 0.75rem;
      margin-left: 6px;
    }

    .sound-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8aacbf;
      font-size: 0.8rem;
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .sound-control input[type="range"] {
      width: 70px;
      background: #162b3a;
      accent-color: #5a9ec9;
      cursor: pointer;
    }

    .badge {
      background: #2a4a60;
      padding: 2px 10px;
      border-radius: 16px;
      font-size: 0.7rem;
      color: #b3d4e8;
    }

    @media (max-width: 500px) {
      .app {
        padding: 12px 8px;
      }
      .eq-row {
        font-size: 1.2rem;
        gap: 2px 8px;
      }
      .eq-row span {
        min-width: 28px;
        padding: 0 6px;
      }
      .input-group input {
        width: 50px;
        font-size: 1rem;
      }
      .btn {
        font-size: 0.8rem;
        padding: 8px 14px;
        min-width: 60px;
      }
      .timer {
        font-size: 1.4rem;
        padding: 0 10px;
      }
      .battle-players {
        gap: 10px;
      }
      .player-box {
        padding: 6px 12px;
        min-width: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- タブ -->
    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" data-tab="tabChallenge">挑戦</button>
      <button class="tab-btn" data-tab="tabBattle">対戦</button>
      <button class="tab-btn" data-tab="tabRanking">ランキング</button>
      <button class="tab-btn" data-tab="tabSettings">設定</button>
    </div>

    <!-- 挑戦タブ -->
    <div id="tabChallenge" class="tab-content active">
      <div class="status-bar">
        <span class="timer" id="timerDisplay">0.0</span>
        <span class="status-msg" id="statusMessage">待機</span>
      </div>

      <div class="eq-panel">
        <div class="eq-row">
          <span id="eq1a">?</span>x + <span id="eq1b">?</span>y = <span id="eq1c">?</span>
        </div>
        <div class="eq-row">
          <span id="eq2a">?</span>x + <span id="eq2b">?</span>y = <span id="eq2c">?</span>
        </div>
      </div>

      <div class="input-area">
        <div class="input-group">
          <label>x =</label>
          <input type="number" id="inputX" step="any" value="0" />
        </div>
        <div class="input-group">
          <label>y =</label>
          <input type="number" id="inputY" step="any" value="0" />
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="newGameBtn">挑戦</button>
        <button class="btn btn-warning" id="stopBtn">ストップ</button>
        <button class="btn btn-success" id="checkBtn">解答</button>
      </div>

      <div class="sound-control">
        <span>音</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" />
        <span id="volumeLabel">50%</span>
        <button class="btn" id="toggleSoundBtn" style="flex:0 1 auto; padding:2px 12px; min-width:40px; font-size:0.75rem;">オン</button>
      </div>

      <div class="toast" id="toastMessage">挑戦ボタンでスタート</div>
    </div>

    <!-- 対戦タブ -->
    <div id="tabBattle" class="tab-content">
      <div class="battle-section">
        <div class="battle-status">
          <span id="battleStatus">待機中</span>
          <span id="battleRound">ラウンド: 0/3</span>
          <span class="badge" id="battleRoomId">ルーム: -</span>
        </div>

        <div class="battle-players">
          <div class="player-box you" id="youBox">
            <div class="name" id="youName">あなた</div>
            <div class="score" id="youScore">0</div>
            <div class="round-status" id="youRoundStatus">-</div>
          </div>
          <div class="player-box opponent" id="opponentBox">
            <div class="name" id="opponentName">相手</div>
            <div class="score" id="opponentScore">0</div>
            <div class="round-status" id="opponentRoundStatus">-</div>
          </div>
        </div>

        <div class="battle-room">
          <input type="text" id="roomIdInput" placeholder="ルームID" />
          <button class="btn btn-primary" id="createRoomBtn">作成</button>
          <button class="btn btn-success" id="joinRoomBtn">参加</button>
          <button class="btn btn-danger" id="leaveRoomBtn">退出</button>
        </div>

        <div class="battle-actions">
          <button class="btn btn-primary" id="battleReadyBtn">準備完了</button>
          <button class="btn btn-warning" id="battleStartBtn" disabled>対戦開始</button>
        </div>

        <div class="battle-log" id="battleLog">
          <div class="log-entry">ログがここに表示されます</div>
        </div>
      </div>
    </div>

    <!-- ランキングタブ -->
    <div id="tabRanking" class="tab-content">
      <div class="rank-section">
        <div class="rank-header">
          <span>ランキング</span>
          <div class="rank-tabs" id="rankTabContainer">
            <button class="rank-tab-btn active" data-digit="1">1桁</button>
            <button class="rank-tab-btn" data-digit="2">2桁</button>
            <button class="rank-tab-btn" data-digit="3">3桁</button>
            <button class="rank-tab-btn" data-digit="4">4桁</button>
            <button class="rank-tab-btn" data-digit="5">5桁</button>
          </div>
        </div>
        <ul class="rank-list" id="rankingList">
          <li class="empty">読み込み中...</li>
        </ul>
        <div class="footer">Firebase · 一人1記録 · 桁別</div>
      </div>
    </div>

    <!-- 設定タブ -->
    <div id="tabSettings" class="tab-content">
      <div class="settings">
        <div class="setting-row">
          <label>ユーザー名</label>
          <input type="text" id="usernameInput" placeholder="名無し" maxlength="16" />
          <button class="btn btn-primary" id="saveUsernameBtn" style="flex:0 1 auto; padding:4px 14px;">保存</button>
          <span class="name-locked" id="nameLockStatus"></span>
        </div>
        <div class="setting-row">
          <label>桁数</label>
          <select id="digitSelect">
            <option value="1">1桁</option>
            <option value="2">2桁</option>
            <option value="3" selected>3桁</option>
            <option value="4">4桁</option>
            <option value="5">5桁</option>
          </select>
          <span style="color:#8aacbf; font-size:0.75rem; margin-left:4px;">(1〜5桁)</span>
        </div>
        <div class="setting-row" style="justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <span style="color:#7b9eb3; font-size:0.75rem;">同じ名前は使用できません</span>
          <span style="color:#7b9eb3; font-size:0.75rem;">一人1記録まで</span>
        </div>
        <div class="delete-section">
          <button class="btn btn-danger" id="deleteAccountBtn" style="min-width:100px; padding:6px 14px; font-size:0.8rem;">アカウント削除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      //  Firebase 設定
      // ============================================================
      const firebaseConfig = {
        apiKey: "AIzaSyAqe24qeS_gYtMA_gnF_lYNP70keCQcpnA",
        authDomain: "renritu-56ae7.firebaseapp.com",
        databaseURL: "https://renritu-56ae7-default-rtdb.firebaseio.com",
        projectId: "renritu-56ae7",
        storageBucket: "renritu-56ae7.firebasestorage.app",
        messagingSenderId: "327969979771",
        appId: "1:327969979771:web:709a0fc2a281dc495e91de",
        measurementId: "G-VFLGB9QXR3"
      };

      let db = null;
      let rankingRef = null;
      let battleRef = null;
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        rankingRef = db.ref('ranking_v5');
        battleRef = db.ref('battle_rooms');
        console.log('Firebase 接続成功');
      } catch (e) {
        console.warn('Firebase 初期化エラー → ローカル保存モード', e);
      }

      // ============================================================
      //  サウンドエンジン
      // ============================================================
      let audioCtx = null;
      let soundEnabled = true;
      let masterVolume = 0.5;

      function initAudio() {
        if (!audioCtx) {
          try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
      }

      function playTone(freq, duration, type = 'sine', volume = 0.3) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume * masterVolume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      let bgmRunning = false;
      let bgmIndex = 0;
      let bgmTimeout = null;
      const bgmPattern = [
        { freq: 523.25, dur: 0.10, type: 'sine' },
        { freq: 587.33, dur: 0.08, type: 'sine' },
        { freq: 659.25, dur: 0.12, type: 'sine' },
        { freq: 523.25, dur: 0.08, type: 'sine' },
        { freq: 587.33, dur: 0.10, type: 'sine' },
        { freq: 659.25, dur: 0.14, type: 'sine' },
      ];

      function playBgmNote() {
        if (!soundEnabled || !bgmRunning) return;
        try {
          const note = bgmPattern[bgmIndex % bgmPattern.length];
          playTone(note.freq, note.dur, note.type, 0.12);
          bgmIndex++;
          bgmTimeout = setTimeout(playBgmNote, note.dur * 1000 + 70);
        } catch (e) {}

      function setCookie(name, value, days = 365) {
        const d = new Date();
        d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
      }

      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? decodeURIComponent(match[2]) : null;
      }

      function deleteCookie(name) {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
      }

      // ============================================================
      //  問題生成
      // ============================================================
      function generateEquation() {
        const digit = getDigit();
        const maxVal = Math.pow(10, digit) - 1;
        const minVal = digit === 1 ? -9 : -(maxVal);
        let x, y, a1, b1, c1, a2, b2, c2;
        let attempts = 0;
        do {
          x = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          y = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          a1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          a2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          c1 = a1 * x + b1 * y;
          c2 = a2 * x + b2 * y;
          attempts++;
        } while ((a1 === 0 && b1 === 0) || (a2 === 0 && b2 === 0) ||
          (a1 === a2 && b1 === b2 && c1 === c2) || attempts < 20 ||
          Math.abs(c1) > 1000000 || Math.abs(c2) > 1000000);
        return { a1, b1, c1, a2, b2, c2, solutionX: x, solutionY: y };
      }

        eq1b.textContent = eq.b1;

        eq2b.textContent = eq.b2;
        eq2c.textContent = eq.c2;
      }

        startTime = Date.now() - elapsedSeconds * 1000;

          timerDisplay.textContent = elapsedSeconds.toFixed(1);
        }, 100);
      }

      function stopTimer() { if (timerInterval) { clearInterval(timerInterval);
          timerInterval = null; } }

      function resetTimer() { stopTimer();
        elapsedSeconds = 0;
        timerDisplay.textContent = '0.0'; }

      // ============================================================

        stopTimer();

      function newGame() {
        if (!isNameLocked) {
          toastMessage('先に設定タブで名前を保存してください');
          return;

        if (battleState.battleActive) {
          toastMessage('対戦中は挑戦できません');
          return;
        }
        stopTimer();
        resetTimer();
        const eq = generateEquation();
        currentEq = eq;
        displayEquation(eq);
        inputX.value = 0;
        inputY.value = 0;
        isSolved = false;
        isGameActive = true;
        statusMsg.textContent = '解答中';

      function checkAnswer() {
        if (!isGameActive || isSolved) { toastMessage('問題がありません'); return; }
        const x = parseFloat(inputX.value);
        const y = parseFloat(inputY.value);
        if (isNaN(x) || isNaN(y)) { toastMessage('数値を入力'); return; }
        const eps = 0.001;
        const eq = currentEq;
        const ok1 = Math.abs(eq.a1 * x + eq.b1 * y - eq.c1) < eps;
        const ok2 = Math.abs(eq.a2 * x + eq.b2 * y - eq.c2) < eps;
        if (ok1 && ok2) {
          isSolved = true;
          isGameActive = false;
          stopTimer();
          stopBgm();
          const finalTime = parseFloat(timerDisplay.textContent);
          statusMsg.textContent = `正解！ ${finalTime.toFixed(1)}s`;
          statusMsg.style.color = '#8bdaa0';
          checkBtn.disabled = true;
          toastMessage(`正解！ ${finalTime.toFixed(1)}秒`);
          playCorrectSound();
          const name = getUsername();
          const digit = getDigit();
          const existing = allRankingData.find(r => r.username === name);
          if (existing) { toastMessage(`「${name}」は既に使用されています`); return; }
          const entry = { username: name, time: Math.round(finalTime * 10) / 10, digit: digit, timestamp: Date.now() };
          saveRanking(entry);
        } else {
          toastMessage('不正解');
          statusMsg.textContent = '不正解';
          statusMsg.style.color = '#f5a3a3';
          playWrongSound();
        }
      }

      function generateBattleEquation() {

        const minVal = digit === 1 ? -9 : -(maxVal);
        let x, y, a1, b1, c1, a2, b2, c2;

        do {

          a1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          a2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          c1 = a1 * x + b1 * y;
          c2 = a2 * x + b2 * y;
          attempts++;
        } while ((a1 === 0 && b1 === 0) || (a2 === 0 && b2 === 0) ||
          (a1 === a2 && b1 === b2 && c1 === c2) || attempts < 20 ||

      function createRoom() {
        if (!isNameLocked) { toastMessage('先に名前を設定してください'); return; }
        if (battleState.roomId) { toastMessage('既にルームに参加しています'); return; }
        const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        const playerId = currentUsername + '_' + Date.now().toString(36);
        const roomData = {
          host: playerId,
          players: {
            [playerId]: {
              username: currentUsername,
              ready: false,
              score: 0,
              roundDone: false,
              joinedAt: Date.now()
            }
          },
          status: 'waiting',
          round: 0,
          maxRounds: 3,
          currentEq: null,
          started: false,
          finished: false,
          createdAt: Date.now()
        };
        if (battleRef) {
          battleRef.child(roomId).set(roomData).then(() => {
            battleState.roomId = roomId;
            battleState.playerId = playerId;
            battleState.isHost = true;
            battleState.isReady = false;
            battleState.isStarted = false;

      function joinRoom() {
        if (!isNameLocked) { toastMessage('先に名前を設定してください'); return; }
        if (battleState.roomId) { toastMessage('既にルームに参加しています'); return; }
        const roomId = roomIdInput.value.trim().toUpperCase();
        if (!roomId) { toastMessage('ルームIDを入力してください'); return; }
        const playerId = currentUsername + '_' + Date.now().toString(36);
        if (battleRef) {
          battleRef.child(roomId).once('value').then((snap) => {
            const data = snap.val();
            if (!data) { toastMessage('ルームが存在しません'); return; }
            if (data.started) { toastMessage('対戦が開始されています'); return; }
            if (data.finished) { toastMessage('対戦は終了しています'); return; }
            const players = data.players || {};
            const playerCount = Object.keys(players).length;
            if (playerCount >= 2) { toastMessage('ルームは満員です'); return; }
            const updates = {};
            updates[`players/${playerId}`] = { username: currentUsername, ready: false, score: 0, roundDone: false,
              joinedAt: Date.now() };
            battleRef.child(roomId).update(updates).then(() => {
              battleState.roomId = roomId;
              battleState.playerId = playerId;
              battleState.isHost = false;
              battleState.isReady = false;
              battleState.isStarted = false;
              battleState.round = 0;
              battleState.myScore = 0;
              battleState.oppScore = 0;
              battleState.myRoundDone = false;
              battleState.oppRoundDone = false;
              battleState.opponentName = 'ホスト待機中';
              battleState.battleActive = false;
              battleState.roundSolved = false;
              addBattleLog(`ルーム ${roomId} に参加しました`);
              updateBattleUI();
              toastMessage(`ルーム ${roomId} に参加`);
              listenRoom(roomId);
            }).catch(err => { console.error(err);
              toastMessage('参加失敗'); });
          }).catch(err => { console.error(err);
            toastMessage('ルーム確認失敗'); });
        } else {
          toastMessage('Firebase接続が必要です');
        }
      }

      function listenRoom(roomId) {
        if (battleState.roomRef) { battleState.roomRef.off(); }
        battleState.roomRef = battleRef.child(roomId);
        battleState.roomRef.on('value', (snap) => {
          const data = snap.val();
          if (!data) {
            addBattleLog('ルームが削除されました');
            leaveRoom();
            return;
          }
          const players = data.players || {};
          const playerIds = Object.keys(players);
          const myId = battleState.playerId;
          let oppId = null;
          let oppName = '待機中';
          let oppReady = false;
          let oppScore = 0;
          let oppRoundDone = false;
          let myReady = false;
          let myScore = 0;
          let myRoundDone = false;
          playerIds.forEach(id => {
            const p = players[id];
            if (id === myId) {
              myReady = p.ready || false;
              myScore = p.score || 0;
              myRoundDone = p.roundDone || false;
            } else {
              oppId = id;
              oppName = p.username || '相手';
              oppReady = p.ready || false;
              oppScore = p.score || 0;
              oppRoundDone = p.roundDone || false;
            }
          });
          battleState.opponentId = oppId;
          battleState.opponentName = oppName;
          battleState.oppScore = oppScore;
          battleState.oppRoundDone = oppRoundDone;
          battleState.myScore = myScore;
          battleState.myRoundDone = myRoundDone;
          battleState.isReady = myReady;
          battleState.isStarted = data.started || false;
          battleState.round = data.round || 0;
          battleState.maxRounds = data.maxRounds || 3;
          battleState.isHost = data.host === myId;
          battleState.battleActive = data.started && !data.finished;

          if (data.finished) {
            battleState.battleActive = false;
            const winner = myScore > oppScore ? 'あなた' : myScore < oppScore ? oppName : '引き分け';
            battleStatus.textContent = `対戦終了！ 勝者: ${winner}`;
            battleStartBtn.disabled = true;
            stopBgm();
          }

          if (data.currentEq && data.started && !data.finished) {
            battleState.currentBattleEq = data.currentEq;
            if (battleState.isStarted && battleState.round <= battleState.maxRounds) {
              displayBattleEquation(data.currentEq);
              if (!battleState.myRoundDone && !battleState.roundSolved) {
                isGameActive = true;
                isSolved = false;
                checkBtn.disabled = false;
                statusMsg.textContent = '対戦中';
                statusMsg.style.color = '#b3d9f0';
              }
            }
          }

          if (data.started && !data.finished && battleState.round > 0 && battleState.round <= battleState.maxRounds) {
            if (battleState.round !== parseInt(battleRound.textContent.match(/\d+/)?.[0] || '0')) {
              resetTimer();
              startTimer();
              playStartSound();
              startBgm();
            }
          }

          updateBattleUI();

          const allReady = playerIds.every(id => players[id]?.ready === true);
          if (battleState.isHost && allReady && playerIds.length === 2 && !data.started) {
            battleStartBtn.disabled = false;
          } else if (!battleState.isHost) {
            battleStartBtn.disabled = true;
          }

          if (data.started && !data.finished) {
            const allDone = playerIds.every(id => players[id]?.roundDone === true);
            if (allDone && battleState.round > 0 && battleState.round <= battleState.maxRounds) {
              if (battleState.isHost) {
                nextRound();
              }
            }
          }

        }, (err) => { console.error('監視エラー:', err); });
      }

      function nextRound() {
        if (!battleState.isHost) return;
        const roomId = battleState.roomId;
        if (!roomId) return;
        const nextRound = battleState.round + 1;
        if (nextRound > battleState.maxRounds) {
          battleRef.child(roomId).update({ finished: true, status: 'finished' });
          addBattleLog('対戦終了！');
          stopBgm();
          return;
        }
        const eq = generateBattleEquation();
        const updates = {
          round: nextRound,
          currentEq: eq,
          'players/' + battleState.playerId + '/roundDone': false,
          'players/' + battleState.playerId + '/score': battleState.myScore,
        };
        if (battleState.opponentId) {
          updates['players/' + battleState.opponentId + '/roundDone'] = false;
          updates['players/' + battleState.opponentId + '/score'] = battleState.oppScore;
        }
        battleRef.child(roomId).update(updates);
        battleState.myRoundDone = false;
        battleState.oppRoundDone = false;
        battleState.roundSolved = false;
        addBattleLog(`ラウンド ${nextRound} 開始`);
        resetTimer();
        startTimer();
        playStartSound();
        startBgm();
        updateBattleUI();
      }

      function toggleReady() {
        if (!battleState.roomId || !battleState.playerId) { toastMessage('ルームに参加してください'); return; }
        const newReady = !battleState.isReady;
        const updates = {};
        updates['players/' + battleState.playerId + '/ready'] = newReady;
        battleRef.child(battleState.roomId).update(updates);
        battleState.isReady = newReady;
        updateBattleUI();
        addBattleLog(newReady ? '準備完了' : '準備解除');
      }

      function startBattle() {
        if (!battleState.isHost) { toastMessage('ホストのみ開始できます'); return; }
        if (!battleState.roomId) { toastMessage('ルームがありません'); return; }
        const roomId = battleState.roomId;
        const eq = generateBattleEquation();
        const updates = {
          started: true,
          status: 'playing',
          round: 1,
          currentEq: eq,
          finished: false,
          'players/' + battleState.playerId + '/roundDone': false,
          'players/' + battleState.playerId + '/score': 0,
          'players/' + battleState.playerId + '/ready': false,
        };
        if (battleState.opponentId) {
          updates['players/' + battleState.opponentId + '/roundDone'] = false;
          updates['players/' + battleState.opponentId + '/score'] = 0;
          updates['players/' + battleState.opponentId + '/ready'] = false;
        }
        battleRef.child(roomId).update(updates).then(() => {
          battleState.isStarted = true;
          battleState.round = 1;
          battleState.myScore = 0;
          battleState.oppScore = 0;
          battleState.myRoundDone = false;
          battleState.oppRoundDone = false;
          battleState.battleActive = true;
          battleState.roundSolved = false;
          battleState.currentBattleEq = eq;
          displayBattleEquation(eq);
          resetTimer();
          startTimer();
          playStartSound();
          startBgm();
          addBattleLog('対戦開始！');
          updateBattleUI();
          toastMessage('対戦開始！');
        }).catch(err => { console.error(err);
          toastMessage('開始失敗'); });
      }

      function checkBattleAnswer() {
        if (!battleState.battleActive || battleState.myRoundDone) {
          toastMessage('対戦がアクティブではありません');
          return;
        }
        if (!battleState.currentBattleEq) { toastMessage('問題がありません'); return; }
        const x = parseFloat(inputX.value);
        const y = parseFloat(inputY.value);
        if (isNaN(x) || isNaN(y)) { toastMessage('数値を入力'); return; }
        const eps = 0.001;
        const eq = battleState.currentBattleEq;
        const ok1 = Math.abs(eq.a1 * x + eq.b1 * y - eq.c1) < eps;
        const ok2 = Math.abs(eq.a2 * x + eq.b2 * y - eq.c2) < eps;
        if (ok1 && ok2) {
          battleState.myRoundDone = true;
          battleState.roundSolved = true;
          battleState.myScore += 1;
          const updates = {};
          updates['players/' + battleState.playerId + '/roundDone'] = true;
          updates['players/' + battleState.playerId + '/score'] = battleState.myScore;
          battleRef.child(battleState.roomId).update(updates);
          playCorrectSound();
          toastMessage('正解！ 1点獲得');
          addBattleLog(`${currentUsername} 正解！ +1点`);
          statusMsg.textContent = '正解！';
          statusMsg.style.color = '#8bdaa0';
          checkBtn.disabled = true;
          isGameActive = false;
          isSolved = true;
          updateBattleUI();
        } else {
          toastMessage('不正解');
          playWrongSound();
        }
      }

      function leaveRoom() {
        if (battleState.roomRef) { battleState.roomRef.off();
          battleState.roomRef = null; }
        if (battleState.roomId && battleState.playerId && battleRef) {
          battleRef.child(battleState.roomId + '/players/' + battleState.playerId).remove();
          if (battleState.isHost) {
            battleRef.child(battleState.roomId).remove().catch(() => {});
          }
        }
        battleState.roomId = null;
        battleState.playerId = null;
        battleState.isHost = false;
        battleState.isReady = false;
        battleState.isStarted = false;
        battleState.round = 0;
        battleState.myScore = 0;
        battleState.oppScore = 0;
        battleState.myRoundDone = false;
        battleState.oppRoundDone = false;
        battleState.opponentName = '待機中';
        battleState.battleActive = false;
        battleState.currentBattleEq = null;
        battleState.roundSolved = false;
        resetTimer();
        stopBgm();
        isGameActive = false;
        isSolved = false;
        checkBtn.disabled = true;
        statusMsg.textContent = '待機';
        statusMsg.style.color = '#c8dce8';
        eq1a.textContent = '?';
        eq1b.textContent = '?';
        eq1c.textContent = '?';
        eq2a.textContent = '?';
        eq2b.textContent = '?';
        eq2c.textContent = '?';
        inputX.value = 0;
        inputY.value = 0;
        addBattleLog('ルームを退出しました');
        updateBattleUI();
        toastMessage('退出しました');
      }

      // ============================================================
      //  アカウント削除
      // ============================================================
      function deleteAccount() {
        const name = getUsername();
        if (!name || name === '名無し') { toastMessage('先にユーザー名を設定してください'); return; }
        const myEntry = allRankingData.find(r => r.username === name);
        if (!myEntry) { toastMessage(`「${name}」の記録は見つかりません`); return; }
        if (!confirm(`「${name}」のアカウントと全ての記録を削除しますか？`)) return;
        if (rankingRef) {
          rankingRef.once('value', (snap) => {
            const data = snap.val();
            if (!data) { toastMessage('削除するデータがありません'); return; }
            const updates = {};
            let found = false;
            Object.keys(data).forEach(key => {
              if (data[key].username === name) { updates[key] = null;
                found = true; }
            });
            if (!found) { toastMessage(`「${name}」の記録は見つかりません`); return; }
            rankingRef.update(updates).then(() => {
              allRankingData = allRankingData.filter(r => r.username !== name);
              localStorage.setItem('rank_v5_all', JSON.stringify(allRankingData));
              deleteCookie('eq_username');
              deleteCookie('eq_name_locked');
              usernameInput.value = '';
              currentUsername = '';
              isNameLocked = false;
              updateNameLockStatus();
              toastMessage(`「${name}」のアカウントと記録を削除しました`);
              renderRanking();
              resetGame();
              stopBgm();
              leaveRoom();
            }).catch((err) => { console.error(err);
              toastMessage('削除に失敗しました'); });
          }).catch((err) => { console.error(err);
            toastMessage('データ取得に失敗しました'); });
        } else {
          allRankingData = allRankingData.filter(r => r.username !== name);
          localStorage.setItem('rank_v5_all', JSON.stringify(allRankingData));
          deleteCookie('eq_username');
          deleteCookie('eq_name_locked');
          usernameInput.value = '';
          currentUsername = '';
          isNameLocked = false;
          updateNameLockStatus();
          toastMessage(`「${name}」のアカウントと記録を削除しました (ローカル)`);
          renderRanking();
          resetGame();
          stopBgm();
          leaveRoom();
        }
      }

      // ============================================================
      //  トースト
      // ============================================================
      function toastMessage(msg) {
        toast.textContent = msg;
        setTimeout(() => {
          if (toast.textContent === msg) { toast.textContent = '挑戦ボタンでスタート'; }
        }, 3000);
      }

      // ============================================================
      //  ランキング桁タブ
      // ============================================================
      rankTabContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.rank-tab-btn');
        if (!btn) return;
        const digit = parseInt(btn.dataset.digit, 10);
        if (isNaN(digit)) return;
        rankTabContainer.querySelectorAll('.rank-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDigit = digit;
        renderRanking();
      });

      // ============================================================
      //  ユーザー名
      // ============================================================
      function loadUsernameFromCookie() {
        const saved = getCookie('eq_username');
        const locked = getCookie('eq_name_locked');
        if (saved) { usernameInput.value = saved;
          currentUsername = saved; }
        if (locked === 'true') { isNameLocked = true; }
        updateNameLockStatus();
      }

      saveUsernameBtn.addEventListener('click', () => {
        if (isNameLocked) { toastMessage('名前は一度設定すると変更できません'); return; }
        const name = usernameInput.value.trim();
        if (!name) { toastMessage('名前を入力してください'); return; }
        const exists = allRankingData.some(r => r.username === name);
        if (exists) { toastMessage(`「${name}」は既に使用されています`); return; }
        isNameLocked = true;
        setCookie('eq_username', name);
        setCookie('eq_name_locked', 'true');
        currentUsername = name;
        updateNameLockStatus();
        toastMessage(`ユーザー名: ${name} を保存しました (変更不可)`);
      });

      // ============================================================
      //  サウンドコントロール
      // ============================================================
      volumeSlider.addEventListener('input', () => {
        masterVolume = parseInt(volumeSlider.value, 10) / 100;
        volumeLabel.textContent = `${Math.round(masterVolume * 100)}%`;
      });

      toggleSoundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        toggleSoundBtn.textContent = soundEnabled ? 'オン' : 'オフ';
        if (!soundEnabled) { stopBgm(); } else { initAudio(); if (isGameActive && !isSolved) { startBgm(); } }
        toastMessage(soundEnabled ? 'サウンドオン' : 'サウンドオフ');
      });

      // ============================================================
      //  イベントバインド
      // ============================================================
      checkBtn.addEventListener('click', () => {
        if (battleState.battleActive) {
          checkBattleAnswer();
        } else {
          checkAnswer();
        }
      });
      newGameBtn.addEventListener('click', newGame);
      stopBtn.addEventListener('click', resetGame);

      createRoomBtn.addEventListener('click', createRoom);
      joinRoomBtn.addEventListener('click', joinRoom);
      leaveRoomBtn.addEventListener('click', leaveRoom);
      battleReadyBtn.addEventListener('click', toggleReady);
      battleStartBtn.addEventListener('click', startBattle);

      deleteAccountBtn.addEventListener('click', deleteAccount);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (document.activeElement === inputX || document.activeElement === inputY)) {
          if (battleState.battleActive) {
            checkBattleAnswer();
          } else {
            checkAnswer();
          }
        }
      });

      digitSelect.addEventListener('change', () => {
        toastMessage(`桁数を ${digitSelect.value} に変更`);
      });

      // ============================================================
      //  初期化
      // ============================================================
      function init() {
        loadUsernameFromCookie();
        loadRanking();
        isGameActive = false;
        isSolved = false;
        checkBtn.disabled = true;
        statusMsg.textContent = '待機';
        resetTimer();

        document.addEventListener('click', () => {
          if (!audioCtx) {
            try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
          }
        }, { once: true });

        updateBattleUI();
      }

      init();
    })();
  </script>
</body>
</html>
